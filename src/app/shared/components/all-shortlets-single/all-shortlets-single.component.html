  <!-- ltn__product-item -->
   <div class="col-lg-12" *ngFor="let listing of shortStayListings">
  <div class="ltn__product-item ltn__product-item-4 ltn__product-item-5 items">
    <div class="product-img image-wrapper">
      <a [routerLink]="['/listings/property-details', listing.id]">
        <img [src]="listing.image" alt="Property Image">
      </a>
      <div class="badges">
        <span class="badge">{{ listing.badge }}</span>
      </div>
    </div>
    <div class="product-details">
    <div class="product-info">
      <div class="product-badge-price">
        <span class="type">{{ listing.type }}</span>
        <div class="product-price">
          <span>{{ listing.price }}<label>{{ listing.frequency }}</label></span>
        </div>
      </div>
      <h2 class="product-title">
        <a [routerLink]="['/listings/property-details', listing.id]">{{ listing.title }}</a>
      </h2>
      <p class="mini-writeup">{{ listing.description }}</p>
      <ul class="ltn__list-item-2--- ltn__list-item-2-before--- ltn__plot-brief">
        <li><span>{{ listing.beds }}</span> Bed</li>
        <li><span>{{ listing.baths }}</span> Bath</li>
      </ul>
      <div class="product-img-location">
        <ul>
          <li>
            <a href="locations.html"><i class="flaticon-pin"></i> {{ listing.location }}</a>
          </li>
        </ul>
      </div>
    </div>
    <div class="product-info-bottom">
      <div class="real-estate-agent">
        <div class="agent-img">
          <a href="team-details.html">
            <img [src]="listing.agentImage" alt="Agent Image">
          </a>
        </div>
        <div class="agent-brief">
          <h6><a href="team-details.html">{{ listing.agentName }}</a></h6>
          <small>{{ listing.agentTitle }}</small>
        </div>
      </div>
      <div class="product-hover-action">
        <small>Listed: {{ listing.listedDate }}</small>
      </div>
    </div>
    </div>

  </div>
</div>
